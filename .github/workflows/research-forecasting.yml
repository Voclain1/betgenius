# Forecasting research engine (research/forecasting) — SYNTHETIC DATA ONLY.
#
# This workflow never receives a database credential and never uploads an
# artifact: every dataset it touches is generated inside the job from fictional
# ids, and the integration step runs the extractor against a throwaway local
# Postgres cluster that is created and deleted within the job. Real extractions
# are run by hand with a dedicated read-only role, outside CI; see
# docs/research/XGBOOST_RESEARCH_ENGINE.md.
#
# Path-filtered, so it runs only when the research engine itself changes and
# adds nothing to the application's own checks or deploys.

name: research-forecasting

on:
  pull_request:
    paths:
      - "research/forecasting/**"
      - "docs/research/**"
      - ".github/workflows/research-forecasting.yml"
      - "src/lib/ai/context.ts"
      - "src/lib/ai/digest.ts"
      - "src/lib/markets.ts"
      - "prisma/schema.prisma"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-forecasting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Extractor logic (synthetic rows)
        run: npx tsx research/forecasting/extract/check-extract-core.ts

      - name: Extractor end to end (throwaway local Postgres, synthetic rows)
        run: bash research/forecasting/extract/integration/run-local-integration.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/forecasting/requirements.txt

      - name: Python dependencies
        run: pip install -r research/forecasting/requirements.txt

      - name: Modelling tests (synthetic datasets)
        working-directory: research/forecasting
        run: python -m pytest -q

      - name: Pipeline smoke run (synthetic)
        working-directory: research/forecasting
        run: |
          python -m bgforecast synth --out "$RUNNER_TEMP/syn"
          python -m bgforecast run --dataset "$RUNNER_TEMP/syn" --out "$RUNNER_TEMP/syn-run" --quick
          head -3 "$RUNNER_TEMP/syn-run/report.md" | grep -q "SYNTHETIC DATA"
