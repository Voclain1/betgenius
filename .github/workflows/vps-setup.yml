# Run once on a fresh VPS (Actions -> vps-setup -> Run workflow), and again
# any time; it is idempotent. Logs in as root with VPS_SSH_KEY, so order the
# server with that key's public half. See docs/VPS_MIGRATION.md.
name: vps-setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
          user: root
      - name: Harden and install Docker
        run: ssh vps 'bash -s /opt/betgenius' < deploy/server-setup.sh
      - name: Check the deploy user can log in
        run: ssh -o User=deploy vps 'docker version --format "docker {{.Server.Version}}" && id'
