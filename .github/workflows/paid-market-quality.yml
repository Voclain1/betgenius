name: paid-market-quality
on:
  pull_request:
    paths:
      - 'src/lib/paidMarketQuality.ts'
      - 'src/lib/paidChronologicalValidation.ts'
      - 'src/lib/paidIntegrityGuards.ts'
      - 'src/lib/paidEntryEvidence.ts'
      - 'src/lib/paidShadowIntegrity.ts'
      - 'src/lib/paidHoldoutPolicy.ts'
      - 'src/lib/paidReturnUncertainty.ts'
      - 'src/lib/paidEvidenceGate.ts'
      - 'src/lib/vipPremiumPipeline.ts'
      - 'src/lib/predictions.ts'
      - 'scripts/check-paid-publication-postgres.ts'
      - 'src/lib/paidQualityDiagnostics.ts'
      - 'src/lib/paidOpsData.ts'
      - 'src/app/admin/paid-ops/page.tsx'
      - 'scripts/check-paid-market-quality.ts'
      - 'scripts/check-paid-chronological-validation.ts'
      - 'scripts/check-paid-integrity-guards.ts'
      - 'scripts/check-paid-entry-evidence.ts'
      - 'scripts/check-paid-shadow-integrity.ts'
      - 'scripts/check-paid-holdout-policy.ts'
      - 'scripts/check-paid-return-uncertainty.ts'
      - 'scripts/check-paid-evidence-gate.ts'
      - 'scripts/report-paid-market-quality.ts'
      - 'package.json'
      - '.github/workflows/paid-market-quality.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check:paid-market-quality
      # Paid access is a release invariant, not an optional downstream check.
      - run: npm run check:subscription-entitlement
      - run: npm run check:paystack-entitlement
      - run: npm run check:onetime-fallback
      - run: npx tsc --noEmit

  postgres-publication:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: betgenius
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: betgenius_paid_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betgenius -d betgenius_paid_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://betgenius:disposable_ci_only@127.0.0.1:5432/betgenius_paid_ci
      DATABASE_URL_UNPOOLED: postgresql://betgenius:disposable_ci_only@127.0.0.1:5432/betgenius_paid_ci
      BETGENIUS_DISPOSABLE_PG: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma db push --skip-generate
      - run: npx tsx scripts/check-paid-publication-postgres.ts
