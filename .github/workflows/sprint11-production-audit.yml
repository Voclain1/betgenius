name: disabled-quota-staging-verify
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: disabled-quota-staging-ops
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Read-only prepared, incoming and running settings verification
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          OPS_ENV_FILE: ${{ secrets.OPS_ENV_FILE }}
        run: python3 scripts/ops/verify-disabled-quota-staging.py
