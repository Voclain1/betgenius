# VIP/Premium Sprint 11: production validation audit. Read-only by default.
# Explicit approved repair/backup-only modes can update ops storage settings
# and offsite backup objects; neither writes the production database.
#
# No schedule: runs on demand (workflow_dispatch) or when the audit itself
# changes on the Sprint 11 branch. Every database session is forced read-only
# and verified by the scripts. No model key is exported and nothing here calls
# a model provider or api-football.
#
#   probe   the running container: deployed tag, image, start time, health and
#           allowlisted flag values (names only from a fixed list, never secrets)
#   audit   scripts/audit-sprint11.ts (job health, Double Chance, spare quota,
#           subscriber value, dry days, spend), the existing paid-performance
#           audit, and the alternative-market settlement (read-only)

name: sprint11-production-audit

on:
  workflow_dispatch:
    inputs:
      operational_safety_only:
        description: "Read-only production target/backup audit; restore only on isolated runner"
        type: boolean
        default: false
      verify_deployment_settings_only:
        description: "Secret-safe read-only repository/VPS backup comparison and authenticated GET; no DB access"
        type: boolean
        default: false
      verify_backup_bucket_only:
        description: "Read-only BetGenius/School Kit bucket and prefix verification"
        type: boolean
        default: false
      use_schoolkit_backup_reader:
        description: "Use existing authenticated School Kit remote for isolated BetGenius recovery proof"
        type: boolean
        default: false
      repair_backup_storage:
        description: "Approved ops-only storage repair and scheduled backup test; requires successful isolated recovery run ID"
        type: boolean
        default: false
      recovery_proof_run_id:
        description: "Successful operational-safety recovery run on this PR branch (required for repair)"
        type: string
        default: ""
      create_fresh_backup_only:
        description: "Run verified existing backup script only; no settings or database changes"
        type: boolean
        default: false
      days:
        description: "look-back in days"
        default: "30"
  push:
    branches: ["ccr-0ae2ea72-2ta0dr"]
    paths:
      - scripts/audit-sprint11.ts
      - scripts/diagnose-entry-price-evidence.ts
      - scripts/measure-supply-funnel.ts
      - scripts/measure-attempt-yield.ts
      - src/lib/supplyFunnel.ts
      - src/lib/sprint11Audit.ts
      - .github/workflows/sprint11-production-audit.yml

permissions:
  contents: read

concurrency:
  group: sprint11-production-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ !inputs.operational_safety_only && !inputs.verify_deployment_settings_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-db-tunnel
        with:
          enabled: ${{ vars.DB_ON_VPS }}
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Running deployment (allowlisted names only)
        if: vars.DB_ON_VPS == 'true'
        run: |
          ssh vps 'bash -s' <<'PROBE'
          set -u
          cd /opt/betgenius || exit 0
          echo "deployed APP_TAG=$(grep '^APP_TAG=' deploy.env | cut -d= -f2)"
          docker compose --env-file deploy.env ps --format '{{.Service}} {{.State}} {{.Status}}' 2>/dev/null || true
          C=$(docker compose --env-file deploy.env ps -q app 2>/dev/null | head -1)
          [ -n "$C" ] || { echo "app container not found"; exit 0; }
          echo "app started $(docker inspect -f '{{.State.StartedAt}}' "$C") image $(docker inspect -f '{{.Config.Image}}' "$C") health $(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$C") restarts $(docker inspect -f '{{.RestartCount}}' "$C")"
          for n in PAID_SPARE_QUOTA_WIDENING COVERAGE_ROLLOUT PAID_QUALITY_POLICY PAID_SELECTION_MODE PAID_ROUTE_PRIMARY_PROVIDER PAID_CALIBRATION_DISABLED API_FOOTBALL_DAILY_LIMIT API_FOOTBALL_DAILY_RESERVE API_FOOTBALL_PAID_RESERVE ANTHROPIC_MODEL APP_ENV; do
            v=$(docker exec "$C" printenv "$n" 2>/dev/null || true)
            echo "running $n=${v:-(unset)}"
          done
          echo "app log lines in the last 6h matching error: $(docker logs --since 6h "$C" 2>&1 | grep -ciE 'error' || true)"
          O=$(docker compose --env-file deploy.env ps -q ops 2>/dev/null | head -1)
          [ -z "$O" ] || { echo "ops cron calls, last 12h:"; docker logs --since 12h "$O" 2>&1 | grep -E 'cron /|-> [0-9]{3}' | tail -20; }
          PROBE
      - name: Public health
        run: |
          for p in / /api/health; do printf '%s -> ' "$p"; curl -s -o /dev/null -m 20 -w '%{http_code}\n' "https://${{ vars.SITE_DOMAIN }}$p" || echo failed; done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Read-only database URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          RO=$(node -e 'const u=new URL(process.env.DATABASE_URL);u.searchParams.set("options","-c default_transaction_read_only=on");console.log(u.toString())')
          echo "::add-mask::$RO"
          echo "DATABASE_URL=$RO" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=$RO" >> "$GITHUB_ENV"
      - name: Sprint 11 audit
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/audit-sprint11.ts "${{ github.event.inputs.days || '30' }}"
      - name: Supply funnel, 14 days (read-only)
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/measure-supply-funnel.ts 14
      - name: Dedicated attempt yield by signal, 30 days (read-only)
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/measure-attempt-yield.ts 30
      - name: Publication-price evidence diagnosis (read-only)
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/diagnose-entry-price-evidence.ts 60
      - name: Paid performance (existing audit, 60 days)
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/measure-paid-performance.ts 60
      - name: Alternative-market settlement (read-only)
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/settle-alt-market-experiment.ts
      - name: Alternative-market screen (no model request)
        env:
          REQUIRE_READ_ONLY: "1"
          ALT_MARKET_SCREEN_ONLY: "1"
        run: npx tsx scripts/run-alt-market-experiment.ts

  operational-safety:
    if: github.event_name == 'workflow_dispatch' && inputs.operational_safety_only && !inputs.repair_backup_storage && !inputs.create_fresh_backup_only && !inputs.verify_deployment_settings_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      scratch:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: isolated_runner_only
          POSTGRES_DB: restore_audit
        options: >-
          --health-cmd "pg_isready -U audit -d restore_audit"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-db-tunnel
        with:
          enabled: ${{ vars.DB_ON_VPS }}
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Local audit self-test
        run: node scripts/ops/readonly-backup-audit.mjs --self-test
      - name: Read-only bucket verification
        if: inputs.verify_backup_bucket_only
        env:
          OPERATIONAL_READ_ONLY_AUDIT: 'yes'
        run: node scripts/ops/verify-backup-bucket.mjs
      - name: Read-only production audit and isolated backup restore
        if: ${{ !inputs.verify_backup_bucket_only }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DB_ON_VPS: ${{ vars.DB_ON_VPS }}
          OPERATIONAL_READ_ONLY_AUDIT: 'yes'
          USE_SCHOOLKIT_BACKUP_READER: ${{ inputs.use_schoolkit_backup_reader }}
          AUDIT_LOCAL_PG_CONTAINER: ${{ job.services.scratch.id }}
          AUDIT_DIR: ${{ runner.temp }}/betgenius-backup-audit
        run: node scripts/ops/readonly-backup-audit.mjs
      - name: Delete runner-only temporary archive
        if: always()
        run: rm -f "${{ runner.temp }}/betgenius-backup-audit/restore.dump"

  backup-storage-repair:
    if: github.event_name == 'workflow_dispatch' && inputs.operational_safety_only && (inputs.repair_backup_storage || inputs.create_fresh_backup_only) && !inputs.verify_deployment_settings_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Require successful isolated recovery proof
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_RUN: ${{ inputs.recovery_proof_run_id }}
        run: |
          [[ "$PROOF_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN" > "$RUNNER_TEMP/proof.json"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/proof.json")); if(r.conclusion!=="success" || r.path!==".github/workflows/sprint11-production-audit.yml" || r.head_branch!=="codex/vip-controlled-quota" || Date.now()-Date.parse(r.updated_at)>3600000) process.exit(1)'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN/jobs" --jq '.jobs[] | select(.name=="operational-safety") | .conclusion' | grep -x success
          # A bucket-only success is not isolated recovery proof.
          gh run view "$PROOF_RUN" --repo "$GITHUB_REPOSITORY" --log > "$RUNNER_TEMP/proof.log"
          node -e 'const s=require("fs").readFileSync(process.env.RUNNER_TEMP+"/proof.log","utf8"); const rows=s.split("\n").filter(l=>l.includes("{\"kind\":\"operational_verdict\"")); if(!rows.some(l=>{const r=JSON.parse(l.slice(l.indexOf("{")));return r.target_verified&&r.daily_backup_fresh&&r.isolated_restore_passed&&r.schema_stable_during_observations&&r.production_written===false}))process.exit(1)'
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Repair only backup storage and test deployed backup script
        if: ${{ !inputs.create_fresh_backup_only }}
        run: ssh vps 'APPROVED_BACKUP_REPAIR=yes python3 -' < scripts/ops/repair-backup-storage.py
      - name: Run only the verified scheduled backup script
        if: inputs.create_fresh_backup_only
        run: ssh vps 'APPROVED_BACKUP_REPAIR=yes BACKUP_ONLY=yes python3 -' < scripts/ops/repair-backup-storage.py

  deployment-settings-verification:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_deployment_settings_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate deployment settings and compare without exposing values
        env:
          OPS_ENV_FILE: ${{ secrets.OPS_ENV_FILE }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          node scripts/ops/validate-backup-settings.mjs
          node scripts/ops/verify-deployment-backup-settings.mjs
