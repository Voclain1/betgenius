# Read-only audit: publication provenance and shadow reassessment findings.
# Never invoke prediction-generation/publish endpoints, change env or mutate DB.
name: BetGenius early publication and reassessment safety trace
on:
  push:
    branches: ["claude/early-activation-20261119"]
    paths: [".github/workflows/early-activation-20261119.yml"]
permissions: { contents: read }
concurrency:
  group: early-activation-production
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Trace early publication source and review-required evidence
        shell: bash
        run: |
          ssh vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/betgenius
          echo "=== Early fixture publication source indicators (no IDs or secrets) ==="
          docker compose --env-file deploy.env exec -T postgres psql -X -U betgenius -d betgenius -v ON_ERROR_STOP=1 -At <<'SQL'
          BEGIN READ ONLY;
          SELECT 'early_free_publication_path',p.status,coalesce(p.provenance,'NULL'),
            coalesce(p."approvedById"=p."authorId",false),count(*),
            coalesce(min(p.confidence),0),coalesce(max(p.confidence),0),
            to_char(min(p."publishedAt") AT TIME ZONE 'UTC','YYYY-MM-DD HH24:MI'),
            to_char(max(p."publishedAt") AT TIME ZONE 'UTC','YYYY-MM-DD HH24:MI')
            FROM "Prediction" p JOIN "AIJob" j ON p."aiJobId"=j.id
            WHERE position('"intent":"EARLY_FREE"' in j.prompt)>0
            GROUP BY p.status,p.provenance,(p."approvedById"=p."authorId")
            ORDER BY p.status,p.provenance;
          SELECT 'publication_batch',
            to_char(date_trunc('minute',p."publishedAt") AT TIME ZONE 'UTC','YYYY-MM-DD HH24:MI'),
            count(*),min(p.confidence),max(p.confidence)
            FROM "Prediction" p JOIN "AIJob" j ON p."aiJobId"=j.id
            WHERE position('"intent":"EARLY_FREE"' in j.prompt)>0
              AND p."publishedAt" IS NOT NULL
            GROUP BY date_trunc('minute',p."publishedAt")
            ORDER BY 2 DESC LIMIT 20;
          SELECT 'early_free_category',l.category,count(*)
            FROM "Prediction" p JOIN "AIJob" j ON p."aiJobId"=j.id
              JOIN "PredictionCategoryLink" l ON l."predictionId"=p.id
            WHERE position('"intent":"EARLY_FREE"' in j.prompt)>0
            GROUP BY l.category ORDER BY l.category;
          SELECT 'reassessment_flags',r.status,r."publicHold",coalesce(r."lastError",'NONE'),count(*),
            to_char(max(r."checkedAt") AT TIME ZONE 'UTC','YYYY-MM-DD HH24:MI')
            FROM "PredictionReassessment" r
            WHERE r.status IN ('REVIEW_REQUIRED','UNKNOWN')
            GROUP BY r.status,r."publicHold",r."lastError"
            ORDER BY r.status,count(*) DESC;
          SELECT 'reassessment_review_details',
            to_char(r."checkedAt" AT TIME ZONE 'UTC','YYYY-MM-DD HH24:MI'),
            r.status,coalesce(r."lastError",'NONE'),
            LEFT(coalesce(r.summary,'NONE'),350),
            (SELECT count(*) FROM "PredictionRevision" v WHERE v."predictionId"=r."predictionId"),
            (SELECT count(*) FROM "PredictionRevision" v WHERE v."predictionId"=r."predictionId" AND v."publiclyVisible"=true)
            FROM "PredictionReassessment" r
            WHERE r.status IN ('REVIEW_REQUIRED','UNKNOWN')
            ORDER BY r."checkedAt" DESC LIMIT 18;
          SELECT 'shadow_revision_kinds',kind,"publiclyVisible",count(*)
            FROM "PredictionRevision" GROUP BY kind,"publiclyVisible" ORDER BY kind;
          COMMIT;
          SQL
          echo "PASS: traced records without changing predictions or rollout"
          REMOTE
