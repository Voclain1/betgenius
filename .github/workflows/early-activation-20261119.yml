# One controlled live post-deploy publish attempt; same endpoint, 70% and
# all safety rules as the installed cron, max 2 selections. Owner requested
# full activation and this policy change. No bypasses, no secret logging.
name: BetGenius controlled early free 70 production smoke
on:
  push:
    branches: ["claude/early-activation-20261119"]
    paths: [".github/workflows/early-activation-20261119.yml"]
permissions: { contents: read }
concurrency:
  group: early-activation-production
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Invoke live guarded early free publisher only; verify response
        shell: bash
        run: |
          ssh vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/betgenius
          C=$(docker compose --env-file deploy.env ps -q app)
          test -n "$C"
          FLAGS=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$C")
          echo "$FLAGS" | grep -qx 'APP_BUILD_ID=a1364bf747e9b41195882244924690aed626da76' || { echo 'REFUSED: unexpected build'; exit 1; }
          echo "$FLAGS" | grep -qx 'EARLY_FIXTURE_MODE=on'
          echo "$FLAGS" | grep -qx 'EARLY_FREE_PUBLICATION_MODE=on'
          echo "$FLAGS" | grep -qx 'PREDICTION_REASSESSMENT_MODE=on'
          curl -fsS --max-time 6 http://127.0.0.1:3000/api/health >/dev/null
          echo 'PASS: safe expected build and active flags; invoking existing guarded route'
          docker compose --env-file deploy.env exec -T app node - <<'NODE'
          (async () => {
            if (!process.env.CRON_SECRET) throw Error("Scheduler credential unavailable");
            const response = await fetch("http://127.0.0.1:3000/api/admin/generate/early-publish?limit=2", {
              headers: { authorization: "Bearer "+process.env.CRON_SECRET },
              cache: "no-store", signal: AbortSignal.timeout(90000),
            });
            const body = await response.json();
            const safe = { http: response.status, ok: body.ok, mode: body.mode,
              considered: body.considered, qualifying: body.qualifying,
              published: body.published, blocked: body.blocked,
              failures: body.failures?.length ?? 0 };
            console.log("EARLY_FREE_70_LIVE_SMOKE", JSON.stringify(safe));
            if (!response.ok || body.ok !== true || body.mode !== "on" ||
                (body.failures?.length ?? 0) !== 0 ||
                body.published > body.qualifying) throw Error("Live free publish check failed");
            console.log("PASS: live early FREE publisher applied unchanged quality/provenance gates");
          })().catch(e=>{console.error("SMOKE_FAILED",e.message);process.exitCode=1;});
          NODE
          echo '=== Post-smoke read-only confidence bands, never prediction IDs ==='
          docker compose --env-file deploy.env exec -T postgres psql -X -U betgenius -d betgenius -v ON_ERROR_STOP=1 -At <<'SQL'
          BEGIN READ ONLY;
          SELECT 'early_free_status',p.status,case
            when p.confidence<70 then 'below70'
            when p.confidence<75 then '70to74'
            when p.confidence<80 then '75to79'
            else '80plus' end,count(*)
          FROM "Prediction" p JOIN "AIJob" j ON j.id=p."aiJobId"
          WHERE position('"intent":"EARLY_FREE"' in j.prompt)>0
          GROUP BY p.status,3 ORDER BY p.status,3;
          SELECT 'latest_live_run',to_char("ranAt",'YYYY-MM-DD HH24:MI:SS'),ok,
            left(coalesce(summary,''),170)
          FROM "JobRun" WHERE job='early-free-publication' ORDER BY "ranAt" DESC LIMIT 1;
          COMMIT;
          SQL
          REMOTE
