# Post-persistence-checkpoint audit. Absolutely READ ONLY. Does not invoke any
# generation or publication endpoint or change VPS settings.
name: BetGenius 20 Nov early-prediction qualification checkpoint
on:
  push:
    branches: ["claude/early-activation-20261119"]
    paths: [".github/workflows/early-activation-20261119.yml"]
permissions: { contents: read }
concurrency:
  group: early-activation-production
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Audit shadow publication and fixture supply since production fix
        shell: bash
        run: |
          ssh vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/betgenius
          C=$(docker compose --env-file deploy.env ps -q app)
          test -n "$C"
          echo "=== Approved running build and modes ==="
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$C" |
            grep -E '^(APP_BUILD_ID|EARLY_FIXTURE_MODE|EARLY_FREE_PUBLICATION_MODE|PREDICTION_REASSESSMENT_MODE)='
          echo "=== Application health ==="
          curl -fsS --max-time 8 http://127.0.0.1:3000/api/health
          echo
          echo "=== Database operational evidence ==="
          docker compose --env-file deploy.env exec -T postgres psql -X -U betgenius -d betgenius -v ON_ERROR_STOP=1 -At <<'SQL'
          BEGIN READ ONLY;
          SELECT 'asof_utc',to_char(now() AT TIME ZONE 'UTC','YYYY-MM-DD HH24:MI:SS');
          SELECT 'run_since_fix',job,count(*),count(*) FILTER (WHERE NOT ok),min("ranAt"),max("ranAt")
            FROM "JobRun" WHERE "ranAt">='2026-11-20 08:01:00+00'::timestamptz
              AND job IN ('early-fixture-discovery','early-free-generation','early-free-publication','prediction-reassessment')
            GROUP BY job ORDER BY job;
          SELECT 'run_latest',job,to_char("ranAt" AT TIME ZONE 'UTC','HH24:MI:SS'),
            ok,left(coalesce(summary,'NULL'),125)
            FROM (SELECT DISTINCT ON (job) job,"ranAt",ok,summary FROM "JobRun"
              WHERE job IN ('early-fixture-discovery','early-free-generation','early-free-publication','prediction-reassessment')
              ORDER BY job,"ranAt" DESC) runs ORDER BY job;
          SELECT 'publish_shadow_6h',count(*),
            count(*) FILTER (WHERE detail::text ILIKE '%"qualifying":1%'),
            count(*) FILTER (WHERE NOT ok)
            FROM "JobRun" WHERE job='early-free-publication' AND "ranAt">NOW()-interval '6 hours';
          SELECT 'latest_shadow_details',to_char("ranAt" AT TIME ZONE 'UTC','HH24:MI'),
            coalesce(detail->>'mode','NULL'),coalesce(detail->>'considered','NULL'),
            coalesce(detail->>'qualifying','NULL'),coalesce(detail->>'published','NULL'),
            coalesce((detail->'blocked')::text,'NULL')
            FROM "JobRun" WHERE job='early-free-publication'
            ORDER BY "ranAt" DESC LIMIT 8;
          SELECT 'fresh_early_window',count(*) FROM "UpcomingFixture"
            WHERE kickoff>NOW()+interval '48 hours'
              AND kickoff<=NOW()+interval '168 hours'
              AND status='NS';
          SELECT 'early_queued_total',count(*) FROM "UpcomingFixture" WHERE "earlyQueuedAt" IS NOT NULL;
          SELECT 'early_queued_available',count(*) FROM "UpcomingFixture"
            WHERE "earlyQueuedAt" IS NOT NULL AND status='NS'
              AND kickoff>NOW()+interval '48 hours'
              AND kickoff<=NOW()+interval '168 hours';
          SELECT 'early_generated_all',count(*),
            count(*) FILTER (WHERE p.confidence>=80),
            count(*) FILTER (WHERE p.status='PENDING_REVIEW'),
            count(*) FILTER (WHERE p.status='PUBLISHED')
            FROM "Prediction" p JOIN "AIJob" j ON j.id=p."aiJobId"
            WHERE position('"intent":"EARLY_FREE"' in j.prompt)>0;
          SELECT 'early_generated_since_fix',count(*),
            count(*) FILTER (WHERE p.confidence>=80),
            coalesce(max(p.confidence),0)
            FROM "Prediction" p JOIN "AIJob" j ON j.id=p."aiJobId"
            WHERE position('"intent":"EARLY_FREE"' in j.prompt)>0
              AND p."createdAt">='2026-11-20 08:01:00+00'::timestamptz;
          SELECT 'early_candidates_today',to_char(p."createdAt" AT TIME ZONE 'UTC','HH24:MI'),
            to_char(p.kickoff AT TIME ZONE 'Africa/Lagos','YYYY-MM-DD HH24:MI'),
            p.confidence,p.status,coalesce(p.provenance,'NULL'),p."contextComplete",
            coalesce(p."marketType",'NULL')
            FROM "Prediction" p JOIN "AIJob" j ON j.id=p."aiJobId"
            WHERE position('"intent":"EARLY_FREE"' in j.prompt)>0
            ORDER BY p."createdAt" DESC LIMIT 15;
          SELECT 'reassessment_states',status,count(*),
            count(*) FILTER (WHERE "checkedAt">='2026-11-20 08:01:00+00'::timestamptz)
            FROM "PredictionReassessment" GROUP BY status ORDER BY status;
          SELECT 'reassessment_recent',coalesce("lastError",'NONE'),status,count(*)
            FROM "PredictionReassessment" WHERE "checkedAt">NOW()-interval '8 hours'
            GROUP BY "lastError",status ORDER BY count(*) DESC LIMIT 10;
          SELECT 'public_holds',count(*) FROM "PredictionReassessment" WHERE "publicHold"=true;
          SELECT 'public_revisions',count(*) FROM "PredictionRevision" WHERE "publiclyVisible"=true;
          COMMIT;
          SQL
          echo "PASS: all production observations read only; no mode or publication change"
          REMOTE
