name: BetGenius durable job history diagnostic - read only
on:
  push:
    branches: ["claude/early-activation-20261119"]
    paths: [".github/workflows/early-activation-20261119.yml"]
permissions: { contents: read }
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Compare cron and DB timestamps, detect missing jobRun instrumentation
        shell: bash
        run: |
          ssh vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/betgenius
          echo '=== App jobRun logger errors, redacted ==='
          docker compose --env-file deploy.env logs --since 4h app 2>&1 |
            grep -E '\[jobRuns\]|prisma:|P2002|P2024|JobRun' |
            sed -E 's|(postgresql://)[^ ]+|\1[REDACTED]|g' | tail -45 || true
          echo '=== Database clock and last four job times ==='
          docker compose --env-file deploy.env exec -T postgres psql -X -U betgenius -d betgenius -v ON_ERROR_STOP=1 -At <<'SQL'
          BEGIN READ ONLY;
          SELECT 'clock', current_setting('TimeZone'),now(), now() AT TIME ZONE 'UTC',now() AT TIME ZONE 'Africa/Lagos';
          SELECT 'last_3h',job,count(*),to_char(max("ranAt"),'YYYY-MM-DD HH24:MI:SS'),
            to_char(max("ranAt") AT TIME ZONE 'UTC','YYYY-MM-DD HH24:MI:SS')
          FROM "JobRun" WHERE job IN ('early-free-publication','early-free-generation','early-fixture-discovery','prediction-reassessment')
            AND "ranAt">now()-interval '3 hours' GROUP BY job ORDER BY job;
          SELECT 'latest_job',job,to_char(max("ranAt"),'YYYY-MM-DD HH24:MI:SS'),max("ranAt")<now()-interval '1 hour'
          FROM "JobRun" WHERE job IN ('early-free-publication','early-free-generation','early-fixture-discovery','prediction-reassessment')
          GROUP BY job ORDER BY job;
          COMMIT;
          SQL
          echo 'PASS: scheduler and metrics examined without changes'
          REMOTE
