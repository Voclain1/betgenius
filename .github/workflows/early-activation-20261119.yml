# Restore the previously approved *controlled* test after a deployment reset.
# Captures and generates early FREE drafts. Publication and reassessment SHADOW
# never make automatic user-facing changes. No automatic public activation.
name: BetGenius early-test resume - guarded
on:
  push:
    branches: ["claude/early-activation-20261119"]
    paths: [".github/workflows/early-activation-20261119.yml"]
permissions: { contents: read }
concurrency:
  group: early-activation-production
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Restore capture ON and publication/reassessment SHADOW with rollback
        shell: bash
        run: |
          ssh vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/betgenius
          EXPECTED=c16e0b5d372b617729a33e17b014716031aa63d6
          C=$(docker compose --env-file deploy.env ps -q app)
          test -n "$C"
          FLAGS=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$C")
          echo "$FLAGS" | grep -qx "APP_BUILD_ID=$EXPECTED" || {
            echo "REFUSED: production image has changed since this morning's audit"; exit 1;
          }
          CAPTURE=$(echo "$FLAGS" | sed -n 's/^EARLY_FIXTURE_MODE=//p')
          PUB=$(echo "$FLAGS" | sed -n 's/^EARLY_FREE_PUBLICATION_MODE=//p')
          REASS=$(echo "$FLAGS" | sed -n 's/^PREDICTION_REASSESSMENT_MODE=//p')
          case "$CAPTURE" in ""|off|shadow) ;; *) echo "REFUSED: capture already active or invalid"; exit 1 ;; esac
          case "$PUB" in ""|off|shadow) ;; *) echo "REFUSED: automatic publication already active"; exit 1 ;; esac
          case "$REASS" in ""|off|shadow) ;; *) echo "REFUSED: reassessment already live"; exit 1 ;; esac
          curl -fsS --max-time 8 http://127.0.0.1:3000/api/health > /dev/null
          BACKUP=/opt/betgenius/app.env.before-early-resume-20261120
          if [ -e "$BACKUP" ]; then echo "REFUSED: backup already exists"; exit 1; fi
          cp -p app.env "$BACKUP"
          chmod 600 "$BACKUP"
          rollback() {
            echo "CONTROLLED RESUME FAILED: restoring original settings"
            cp -p "$BACKUP" app.env
            docker compose --env-file deploy.env up -d --no-deps --force-recreate app || true
          }
          trap rollback ERR
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app.env")
          settings={"EARLY_FIXTURE_MODE":"on","EARLY_FREE_PUBLICATION_MODE":"shadow",
                    "PREDICTION_REASSESSMENT_MODE":"shadow"}
          old=p.read_text().splitlines()
          data=[s for s in old if not any(s.startswith(k+"=") for k in settings)]
          data.extend(f"{k}={v}" for k,v in settings.items())
          p.write_text("\n".join(data)+"\n")
          PY
          docker compose --env-file deploy.env up -d --no-deps --force-recreate app
          HEALTHY=no
          for i in $(seq 1 36); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/api/health > /dev/null 2>&1; then HEALTHY=yes; break; fi
            sleep 3
          done
          test "$HEALTHY" = yes
          C=$(docker compose --env-file deploy.env ps -q app)
          LIVE=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$C")
          echo "$LIVE" | grep -qx "APP_BUILD_ID=$EXPECTED"
          echo "$LIVE" | grep -qx 'EARLY_FIXTURE_MODE=on'
          echo "$LIVE" | grep -qx 'EARLY_FREE_PUBLICATION_MODE=shadow'
          echo "$LIVE" | grep -qx 'PREDICTION_REASSESSMENT_MODE=shadow'
          trap - ERR
          echo "PASS: capture ON; automatic publication SHADOW; reassessment SHADOW; production healthy"
          REMOTE
