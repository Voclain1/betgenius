# Stage 3: bounded real-world verification, ALL NEW FEATURES SHADOW/OFF.
name: Early activation - verified shadow discovery and site smoke
on:
  push:
    branches: ["claude/early-activation-20261119"]
    paths: [".github/workflows/early-activation-20261119.yml"]
permissions: { contents: read }
concurrency:
  group: early-activation-production
  cancel-in-progress: false
jobs:
  live-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Sample additional leagues and predictions safely, verify public pages
        run: |
          ssh vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/betgenius
          C=$(docker compose --env-file deploy.env ps -q app)
          FLAGS=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$C")
          echo "$FLAGS" | grep -qx 'APP_BUILD_ID=fb4b1becd844db2909a833ba158c4d9414918fac'
          echo "$FLAGS" | grep -qx 'EARLY_FIXTURE_MODE=shadow'
          echo "$FLAGS" | grep -qx 'EARLY_FREE_PUBLICATION_MODE=off'
          echo "$FLAGS" | grep -qx 'PREDICTION_REASSESSMENT_MODE=shadow'
          curl -fsS --max-time 6 http://127.0.0.1:3000/api/health > /dev/null
          echo "=== Bounded shadow discovery and reassessment ==="
          docker compose --env-file deploy.env exec -T app node - <<'NODE'
          (async () => {
            if (!process.env.CRON_SECRET) throw Error("Cron auth unavailable");
            async function get(url) {
              const r=await fetch("http://127.0.0.1:3000"+url, {
                headers: {authorization:"Bearer "+process.env.CRON_SECRET},
                cache:"no-store",signal:AbortSignal.timeout(95000),
              });
              const p=await r.json();
              console.log(JSON.stringify({endpoint:url,status:r.status,mode:p.mode,ok:p.ok,
                scanned:p.scanned,fixturesSeen:p.fixturesSeen,cached:p.cached,candidatesQueued:p.candidatesQueued,
                quotaRemaining:p.quotaRemaining,checked:p.checked,current:p.current,flagged:p.flagged,
                withdrawn:p.withdrawn,failures:p.failures,summary:p.summary}));
              if(!r.ok||p.ok!==true)throw Error(url+" failed");
              return p;
            }
            const discovery=await get("/api/admin/generate/early-discover?batch=3");
            if(discovery.mode!=="shadow"||discovery.candidatesQueued!==0)throw Error("Unsafe capture mode or queued work");
            const assessment=await get("/api/admin/generate/reassess?limit=2");
            if(assessment.mode!=="shadow"||assessment.withdrawn!==0)throw Error("Unsafe monitoring mode or withdrawal");
            for(const path of ["/predictions/weekend","/predictions/genius","/predictions/banker",
              "/predictions/today","/predictions/midweek","/predictions/goals"]) {
              const r=await fetch("http://127.0.0.1:3000"+path, {signal:AbortSignal.timeout(20000)});
              const html=await r.text();
              console.log(JSON.stringify({page:path,status:r.status,length:html.length,
                hasTitle:/<title>[^<]+<\\/title>/.test(html)}));
              if(r.status!==200||!html.includes("BetGenius"))throw Error("Public page regression: "+path);
            }
          })().catch(e=>{console.error("VALIDATION_FAILURE",e.message);process.exitCode=1;});
          NODE
          echo "=== Forward-horizon cache and public isolation ==="
          docker compose --env-file deploy.env exec -T postgres psql -X -U betgenius -d betgenius -v ON_ERROR_STOP=1 -Atc '
          BEGIN READ ONLY;
          SELECT '"'"'cache_total'"'"',count(*) FROM "UpcomingFixture";
          SELECT '"'"'cache_48_to_168h'"'"',count(*) FROM "UpcomingFixture" WHERE kickoff > NOW()+interval '"'"'48 hours'"'"' AND kickoff <= NOW()+interval '"'"'168 hours'"'"' AND status='"'"'NS'"'"';
          SELECT '"'"'early_queued'"'"',count(*) FROM "UpcomingFixture" WHERE "earlyQueuedAt" IS NOT NULL;
          SELECT '"'"'reassessment_states'"'"',"status",count(*) FROM "PredictionReassessment" GROUP BY "status" ORDER BY "status";
          SELECT '"'"'public_holds'"'"',count(*) FROM "PredictionReassessment" WHERE "publicHold" = true;
          SELECT '"'"'visible_revisions'"'"',count(*) FROM "PredictionRevision" WHERE "publiclyVisible" = true;
          COMMIT;' < /dev/null
          REMOTE
