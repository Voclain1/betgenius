# Read-only post-deploy observation: the early FREE publisher now uses the
# existing Genius 70% curation floor instead of Premium 80%. Never trigger a
# generation, publication, reassessment or paid-tier write here.
name: BetGenius verify early free 70 tier alignment - read only
on:
  push:
    branches: ["claude/early-activation-20261119"]
    paths: [".github/workflows/early-activation-20261119.yml"]
permissions: { contents: read }
concurrency:
  group: early-activation-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Verify modes and 70–79 free draft supply without modifying production
        shell: bash
        run: |
          ssh vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/betgenius
          C=$(docker compose --env-file deploy.env ps -q app)
          test -n "$C"
          echo '=== Live build and three activation flags ==='
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$C" |
            grep -E '^(APP_BUILD_ID|EARLY_FIXTURE_MODE|EARLY_FREE_PUBLICATION_MODE|PREDICTION_REASSESSMENT_MODE)='
          echo '=== Health ==='
          curl -fsS --max-time 10 http://127.0.0.1:3000/api/health
          echo
          echo '=== Tier-aligned early FREE supply, no prediction IDs or secrets ==='
          docker compose --env-file deploy.env exec -T postgres psql -X -U betgenius -d betgenius -v ON_ERROR_STOP=1 -At <<'SQL'
          BEGIN READ ONLY;
          SELECT 'asof',to_char(now() AT TIME ZONE 'Africa/Lagos','YYYY-MM-DD HH24:MI:SS');
          SELECT 'free_early_rows',p.status,
            case when p.confidence<70 then 'below70'
              when p.confidence<75 then '70to74'
              when p.confidence<80 then '75to79'
              else '80plus' end,
            count(*)
          FROM "Prediction" p JOIN "AIJob" j ON j.id=p."aiJobId"
          WHERE position('"intent":"EARLY_FREE"' in j.prompt)>0
          GROUP BY p.status,2 ORDER BY p.status,2;
          SELECT 'pending_free_lead_window',count(*),count(*) FILTER(WHERE p.confidence>=70),
            count(*) FILTER(WHERE p.confidence BETWEEN 70 AND 79 AND p."contextComplete"),
            count(*) FILTER(WHERE p.confidence>=80)
          FROM "Prediction" p JOIN "AIJob" j ON j.id=p."aiJobId"
          WHERE position('"intent":"EARLY_FREE"' in j.prompt)>0 AND p.status='PENDING_REVIEW'
            AND p.kickoff>now()+interval '48 hours'
            AND p.kickoff<=now()+interval '168 hours';
          SELECT 'jobs_since_release',job,count(*),
            count(*) FILTER(WHERE NOT ok),max("ranAt") AT TIME ZONE 'Africa/Lagos'
          FROM "JobRun"
          WHERE "ranAt">='2026-11-20 13:54:58+00'::timestamptz
            AND job IN ('early-free-publication','early-free-generation','early-fixture-discovery','prediction-reassessment')
          GROUP BY job ORDER BY job;
          SELECT 'latest_publisher_run',to_char("ranAt" AT TIME ZONE 'Africa/Lagos','YYYY-MM-DD HH24:MI'),ok,
            left(coalesce(summary,'NULL'),180),coalesce(detail::text,'NULL')
          FROM "JobRun" WHERE job='early-free-publication'
          ORDER BY "ranAt" DESC LIMIT 1;
          COMMIT;
          SQL
          echo 'PASS: live code/modes and confidence buckets audited without production writes'
          REMOTE
