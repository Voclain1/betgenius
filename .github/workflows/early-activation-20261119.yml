# One-shot read-only operational audit of early prediction rollout.
# No feature flags, scheduled jobs, predictions or database records are changed.
name: Early prediction production audit - read only
on:
  push:
    branches: ["claude/early-activation-20261119"]
    paths: [".github/workflows/early-activation-20261119.yml"]
permissions: { contents: read }
concurrency:
  group: early-activation-production
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Verify live flags, scheduled execution, free-tip thresholds and protections
        shell: bash
        run: |
          ssh vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/betgenius
          echo "=== Exact deployed build, running state, and activation flags ==="
          C=$(docker compose --env-file deploy.env ps -q app)
          test -n "$C"
          docker inspect --format 'app_state={{.State.Status}} build={{range .Config.Env}}{{if (eq (slice . 0 0) "")}}{{end}}{{end}}' "$C" 2>/dev/null || true
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$C" |
            grep -E '^(APP_BUILD_ID|EARLY_FIXTURE_MODE|EARLY_FREE_PUBLICATION_MODE|PREDICTION_REASSESSMENT_MODE)='
          echo "=== Health ==="
          curl -fsS --max-time 8 http://127.0.0.1:3000/api/health
          echo
          echo "=== Ops container + installed schedule ==="
          docker compose --env-file deploy.env ps ops
          docker compose --env-file deploy.env exec -T ops sh -c 'grep -E "early-(discover|run|publish)|/generate/reassess" /etc/crontabs/root'
          echo "=== Durable scheduler history and qualification aggregates ==="
          docker compose --env-file deploy.env exec -T postgres psql -X -U betgenius -d betgenius -v ON_ERROR_STOP=1 -At <<'SQL'
          BEGIN READ ONLY;
          SELECT 'server_time_utc', TO_CHAR(NOW() AT TIME ZONE 'UTC','YYYY-MM-DD HH24:MI:SS');
          SELECT 'run_3h',job,count(*),sum(case when ok then 0 else 1 end)
            FROM "JobRun"
            WHERE "ranAt" > NOW()-interval '3 hours'
              AND job IN ('early-fixture-discovery','early-free-generation','early-free-publication','prediction-reassessment')
            GROUP BY job ORDER BY job;
          SELECT 'latest_job',job,to_char("ranAt" AT TIME ZONE 'UTC','YYYY-MM-DD HH24:MI:SS'),ok,
            left(coalesce(summary,'NULL'),155)
            FROM (SELECT DISTINCT ON (job) job,"ranAt",ok,summary FROM "JobRun"
              WHERE job IN ('early-fixture-discovery','early-free-generation','early-free-publication','prediction-reassessment')
              ORDER BY job,"ranAt" DESC) runs ORDER BY job;
          SELECT 'cache_2to7d',count(*) FROM "UpcomingFixture"
            WHERE kickoff > NOW()+interval '48 hours' AND kickoff <= NOW()+interval '168 hours' AND status='NS';
          SELECT 'total_early_queued',count(*) FROM "UpcomingFixture" WHERE "earlyQueuedAt" IS NOT NULL;
          SELECT 'early_free_predictions',count(*),coalesce(min(p.confidence),0),coalesce(max(p.confidence),0),
            count(*) FILTER (WHERE p.confidence>=80),count(*) FILTER (WHERE p.status='PENDING_REVIEW')
            FROM "Prediction" p JOIN "AIJob" j ON j.id=p."aiJobId"
            WHERE position('"intent":"EARLY_FREE"' in j.prompt)>0;
          SELECT 'early_free_highconfidence_pending',count(*) FROM "Prediction" p JOIN "AIJob" j ON j.id=p."aiJobId"
            WHERE position('"intent":"EARLY_FREE"' in j.prompt)>0
              AND p.status='PENDING_REVIEW' AND p.confidence>=80
              AND p.kickoff > NOW()+interval '48 hours' AND p.kickoff <= NOW()+interval '168 hours';
          SELECT 'early_free_provenance',coalesce(p.provenance,'NULL'),count(*)
            FROM "Prediction" p JOIN "AIJob" j ON j.id=p."aiJobId"
            WHERE position('"intent":"EARLY_FREE"' in j.prompt)>0
            GROUP BY p.provenance ORDER BY p.provenance;
          SELECT 'monitor_status',status,count(*) FROM "PredictionReassessment" GROUP BY status ORDER BY status;
          SELECT 'public_holds',count(*) FROM "PredictionReassessment" WHERE "publicHold"=true;
          SELECT 'public_visible_revisions',count(*) FROM "PredictionRevision" WHERE "publiclyVisible"=true;
          COMMIT;
          SQL
          echo "PASS: production audit ran read-only"
          REMOTE
