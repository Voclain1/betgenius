# One-shot controlled activation of early fixture capture in SHADOW only.
# Rollback on health failure; no free publication/reassessment activation.
name: Early activation - capture shadow and bounded live probe
on:
  push:
    branches: ["claude/early-activation-20261119"]
    paths: [".github/workflows/early-activation-20261119.yml"]
permissions:
  contents: read
concurrency:
  group: early-activation-production
  cancel-in-progress: false
jobs:
  shadow-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Check running commit and set capture shadow only, with rollback
        shell: bash
        run: |
          ssh vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/betgenius
          EXPECTED=fb4b1becd844db2909a833ba158c4d9414918fac
          C=$(docker compose --env-file deploy.env ps -q app)
          test -n "$C"
          RUNNING=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$C" | sed -n 's/^APP_BUILD_ID=//p')
          test "$RUNNING" = "$EXPECTED" || { echo "REFUSED: running build differs from approved PR #209"; exit 1; }
          CURRENT=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$C" | sed -n 's/^EARLY_FIXTURE_MODE=//p')
          PUBLISH=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$C" | sed -n 's/^EARLY_FREE_PUBLICATION_MODE=//p')
          REASSESS=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$C" | sed -n 's/^PREDICTION_REASSESSMENT_MODE=//p')
          if [ "$CURRENT" != "" ] && [ "$CURRENT" != "off" ] && [ "$CURRENT" != "shadow" ]; then
            echo "REFUSED: existing capture mode not off/shadow"; exit 1
          fi
          if [ "$PUBLISH" != "" ] && [ "$PUBLISH" != "off" ]; then
            echo "REFUSED: publication is not off"; exit 1
          fi
          if [ "$REASSESS" != "" ] && [ "$REASSESS" != "off" ]; then
            echo "REFUSED: reassessment is not off"; exit 1
          fi
          curl -fsS --max-time 10 http://127.0.0.1:3000/api/health > /dev/null
          BACKUP="/opt/betgenius/app.env.before-early-shadow-20261119"
          if [ -e "$BACKUP" ]; then echo "REFUSED: activation backup already exists; manual review required"; exit 1; fi
          cp -p app.env "$BACKUP"
          chmod 600 "$BACKUP"
          rollback() {
            echo "SHADOW ACTIVATION FAILED: restoring prior runtime configuration"
            cp -p "$BACKUP" app.env
            docker compose --env-file deploy.env up -d --no-deps --force-recreate app || true
          }
          trap rollback ERR
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app.env")
          data = p.read_text()
          replacements = {
            "EARLY_FIXTURE_MODE": "shadow",
            "EARLY_FREE_PUBLICATION_MODE": "off",
            "PREDICTION_REASSESSMENT_MODE": "off",
          }
          seen = set()
          out = []
          for line in data.splitlines():
            name = line.split("=", 1)[0] if "=" in line else ""
            if name in replacements:
              if name not in seen:
                out.append(f"{name}={replacements[name]}")
                seen.add(name)
            else:
              out.append(line)
          out.extend(f"{key}={value}" for key, value in replacements.items() if key not in seen)
          p.write_text("\n".join(out) + "\n")
          PY
          docker compose --env-file deploy.env up -d --no-deps --force-recreate app
          HEALTHY=no
          for attempt in $(seq 1 36); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/api/health > /dev/null 2>&1; then HEALTHY=yes; break; fi
            sleep 3
          done
          test "$HEALTHY" = yes
          C=$(docker compose --env-file deploy.env ps -q app)
          FLAGS=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$C")
          echo "$FLAGS" | grep -qx 'EARLY_FIXTURE_MODE=shadow'
          echo "$FLAGS" | grep -qx 'EARLY_FREE_PUBLICATION_MODE=off'
          echo "$FLAGS" | grep -qx 'PREDICTION_REASSESSMENT_MODE=off'
          echo "$FLAGS" | grep -qx "APP_BUILD_ID=$EXPECTED"
          trap - ERR
          echo "PASS: exact deployed build healthy; capture=shadow, publication=off, reassessment=off"
          echo "=== Run exactly one bounded live discovery (2 leagues, shadow only) ==="
          docker compose --env-file deploy.env exec -T app node - <<'NODE'
          (async () => {
            if (!process.env.CRON_SECRET) throw new Error("Scheduler token missing in running app");
            const response = await fetch("http://127.0.0.1:3000/api/admin/generate/early-discover?batch=2", {
              headers: { authorization: "Bearer " + process.env.CRON_SECRET },
              cache: "no-store",
              signal: AbortSignal.timeout(60000),
            });
            const body = await response.json();
            // Only operational counts: never print credentials, predictions, or personal data.
            console.log(JSON.stringify({
              httpStatus: response.status, mode: body.mode,
              ok: body.ok, scanned: body.scanned, fixturesSeen: body.fixturesSeen,
              cached: body.cached, candidatesQueued: body.candidatesQueued,
              quotaRemaining: body.quotaRemaining, elapsedMs: body.elapsedMs,
              failures: body.failures, summary: body.summary,
            }));
            if (!response.ok || body.mode !== "shadow" || body.ok !== true || body.candidatesQueued !== 0)
              process.exitCode = 1;
          })().catch(e => { console.error("SHADOW_PROBE_ERROR:", e.message); process.exitCode = 1; });
          NODE
          echo "=== Aggregate verification: safe shadow data only ==="
          docker compose --env-file deploy.env exec -T postgres psql -X -U betgenius -d betgenius -v ON_ERROR_STOP=1 -Atc '
          BEGIN READ ONLY;
          SELECT '"'"'upcomingFixture'"'"',count(*) FROM "UpcomingFixture";
          SELECT '"'"'early_queued'"'"',count(*) FROM "UpcomingFixture" WHERE "earlyQueuedAt" IS NOT NULL;
          SELECT '"'"'reassessment'"'"',count(*) FROM "PredictionReassessment";
          SELECT '"'"'revisions'"'"',count(*) FROM "PredictionRevision";
          COMMIT;'
          REMOTE
