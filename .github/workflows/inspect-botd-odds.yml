# Read-only: where did the Bet of the Day price come from? Prints the cached
# bookmaker quotes behind it and how often a best price sits far above the
# median. No provider calls, no writes (the session is forced read-only).
name: inspect-botd-odds

on:
  workflow_dispatch:
  push:
    branches: ["ccr-*"]
    paths:
      - scripts/inspect-botd-odds.ts
      - .github/workflows/inspect-botd-odds.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-db-tunnel
        with:
          enabled: ${{ vars.DB_ON_VPS }}
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Read-only database URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          RO=$(node -e 'const u=new URL(process.env.DATABASE_URL);u.searchParams.set("options","-c default_transaction_read_only=on");console.log(u.toString())')
          echo "::add-mask::$RO"
          echo "DATABASE_URL=$RO" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=$RO" >> "$GITHUB_ENV"
      - name: Bet of the Day quotes and best-vs-median spread
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/inspect-botd-odds.ts
