name: Early fixture readiness checks

on:
  pull_request:
    paths:
      - "src/lib/generation/earlyFixturePolicy.ts"
      - "src/lib/generation/earlyFixtureDiscovery.ts"
      - "src/lib/generation/earlyPublication.ts"
      - "src/lib/generation/earlyGeneration.ts"
      - "src/lib/categoryPredictions.ts"
      - "src/app/(public)/predictions/[category]/page.tsx"
      - "src/app/api/admin/generate/early-run/**"
      - "src/app/api/admin/reassessment/resolve/**"
      - "src/lib/reassessment/**"
      - "src/app/api/admin/generate/early-publish/**"
      - "src/app/api/admin/generate/reassess/**"
      - "src/app/api/admin/reassessment/**"
      - "src/app/admin/reassessment/**"
      - "src/app/(public)/predictions/updates/**"
      - "scripts/check-reassessment.ts"
      - "scripts/check-early-readiness-db.ts"
      - "src/lib/generation/selector.ts"
      - "src/lib/periodPredictions.ts"
      - "src/app/api/admin/generate/early-discover/route.ts"
      - "scripts/check-early-fixtures.ts"
      - "scripts/check-period-predictions.ts"
      - "prisma/schema.prisma"
      - ".github/workflows/early-fixtures.yml"
  workflow_dispatch:

jobs:
  early-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EARLY_FIXTURE_MODE: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/betgenius"
          DATABASE_URL_UNPOOLED: "postgresql://user:pass@localhost:5432/betgenius"
      - run: npx tsc --noEmit
      - run: npm run check:early-fixtures
      - run: npm run check:reassessment
      - run: npm run check:period-predictions

  postgres-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: betgenius
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: betgenius_early_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betgenius -d betgenius_early_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://betgenius:disposable_ci_only@127.0.0.1:5432/betgenius_early_ci
      DATABASE_URL_UNPOOLED: postgresql://betgenius:disposable_ci_only@127.0.0.1:5432/betgenius_early_ci
      BETGENIUS_DISPOSABLE_PG: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma db push --skip-generate
      - run: npx tsx scripts/check-early-readiness-db.ts
