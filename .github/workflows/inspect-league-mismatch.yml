# Read-only: predictions stored under a competition they do not belong to.
# No provider calls, no writes (the session is forced read-only).
name: inspect-league-mismatch

# Querying the actual production DB must be an explicit owner action. Do
# not run it implicitly on every feature-branch push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-db-tunnel
        with:
          enabled: ${{ vars.DB_ON_VPS }}
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Read-only database URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          RO=$(node -e 'const u=new URL(process.env.DATABASE_URL);u.searchParams.set("options","-c default_transaction_read_only=on");console.log(u.toString())')
          echo "::add-mask::$RO"
          echo "DATABASE_URL=$RO" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=$RO" >> "$GITHUB_ENV"
      - name: Predictions stored under the wrong competition
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/inspect-league-mismatch.ts 39
