# Read-only production audit of market-selection quality (prediction quality
# investigation, Nov 2026). Runs scripts/audit-market-quality.ts on a session
# Postgres keeps read-only (default_transaction_read_only=on); the script
# refuses to start unless it can confirm that. Aggregates only: this repository
# is public, so the log contains no reasoning text and no user data.
# No football-API or model calls are made.

name: market-quality-audit

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days to look back over"
        default: "30"
  push:
    branches: ["claude/**", "ccr-*"]
    paths:
      - scripts/audit-market-quality.ts
      - scripts/backtest-market-selection.ts
      - scripts/diagnose-paid-supply.ts
      - scripts/diagnose-paid-drafts.ts
      - .github/workflows/market-quality-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-db-tunnel
        with:
          enabled: ${{ vars.DB_ON_VPS }}
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Read-only database URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          RO=$(node -e 'const u=new URL(process.env.DATABASE_URL);u.searchParams.set("options","-c default_transaction_read_only=on");console.log(u.toString())')
          echo "::add-mask::$RO"
          echo "DATABASE_URL=$RO" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=$RO" >> "$GITHUB_ENV"
      - name: Paid supply diagnosis
        env:
          REQUIRE_READ_ONLY: "1"
          API_FOOTBALL_KEY: ""
        run: npx tsx scripts/diagnose-paid-supply.ts
      - name: Paid draft diagnosis
        env:
          REQUIRE_READ_ONLY: "1"
          API_FOOTBALL_KEY: ""
        run: npx tsx scripts/diagnose-paid-drafts.ts 30
      - name: Market quality audit
        env:
          REQUIRE_READ_ONLY: "1"
          API_FOOTBALL_KEY: ""
        run: npx tsx scripts/audit-market-quality.ts "${{ github.event.inputs.days || '30' }}"
      - name: Market selection backtest
        if: hashFiles('scripts/backtest-market-selection.ts') != ''
        env:
          REQUIRE_READ_ONLY: "1"
          API_FOOTBALL_KEY: ""
        run: npx tsx scripts/backtest-market-selection.ts "${{ github.event.inputs.days || '45' }}"
