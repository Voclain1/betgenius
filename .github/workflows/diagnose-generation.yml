# Read-only production diagnostics, runnable without a terminal: generation
# lead time (job "leadtime") and the VIP/PREMIUM funnel and record (job
# "vip-premium").
#
# Runs scripts/measure-generation-leadtime.ts against the production database
# on a session Postgres itself keeps read-only (default_transaction_read_only),
# and the script refuses to start unless it can confirm that. Output is the job
# log. Trigger it from the Actions tab ("Run workflow"), or by pushing a change
# to the script or this file on a claude/* branch.

name: diagnose-generation

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Kickoff days to look back over"
        default: "7"
  push:
    branches: ["claude/**"]
    paths:
      - scripts/measure-generation-leadtime.ts
      - scripts/measure-vip-premium.ts
      - scripts/measure-football-data.ts
      - scripts/measure-genius.ts
      - scripts/measure-paid-performance.ts
      - scripts/backtest-paid-selection.ts
      - scripts/fit-calibration.ts
      - scripts/verify-paid-production.ts
      - scripts/measure-league-coverage.ts
      - scripts/research-league-coverage.ts
      - scripts/validate-paid-candidate-quality.ts
      - .github/workflows/diagnose-generation.yml

permissions:
  contents: read

jobs:
  leadtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/vps-db-tunnel
        with:
          enabled: ${{ vars.DB_ON_VPS }}
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Read-only database URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          RO=$(node -e 'const u=new URL(process.env.DATABASE_URL);u.searchParams.set("options","-c default_transaction_read_only=on");console.log(u.toString())')
          echo "::add-mask::$RO"
          echo "DATABASE_URL=$RO" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=$RO" >> "$GITHUB_ENV"
      - name: Lead time, causes, throughput, queue, api usage
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/measure-generation-leadtime.ts "${{ github.event.inputs.days || '7' }}"

  vip-premium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/vps-db-tunnel
        with:
          enabled: ${{ vars.DB_ON_VPS }}
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Read-only database URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          RO=$(node -e 'const u=new URL(process.env.DATABASE_URL);u.searchParams.set("options","-c default_transaction_read_only=on");console.log(u.toString())')
          echo "::add-mask::$RO"
          echo "DATABASE_URL=$RO" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=$RO" >> "$GITHUB_ENV"
      - name: VIP/PREMIUM funnel, attempts, feeds, picks and record
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/measure-vip-premium.ts "${{ github.event.inputs.days || '4' }}"

  football-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/vps-db-tunnel
        with:
          enabled: ${{ vars.DB_ON_VPS }}
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Read-only database URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          RO=$(node -e 'const u=new URL(process.env.DATABASE_URL);u.searchParams.set("options","-c default_transaction_read_only=on");console.log(u.toString())')
          echo "::add-mask::$RO"
          echo "DATABASE_URL=$RO" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=$RO" >> "$GITHUB_ENV"
      - name: League tables, crests, squads and coaches freshness
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/measure-football-data.ts

  genius:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/vps-db-tunnel
        with:
          enabled: ${{ vars.DB_ON_VPS }}
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Read-only database URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          RO=$(node -e 'const u=new URL(process.env.DATABASE_URL);u.searchParams.set("options","-c default_transaction_read_only=on");console.log(u.toString())')
          echo "::add-mask::$RO"
          echo "DATABASE_URL=$RO" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=$RO" >> "$GITHUB_ENV"
      - name: Genius curation and feeds
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/measure-genius.ts

  paid-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/vps-db-tunnel
        with:
          enabled: ${{ vars.DB_ON_VPS }}
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Read-only database URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          RO=$(node -e 'const u=new URL(process.env.DATABASE_URL);u.searchParams.set("options","-c default_transaction_read_only=on");console.log(u.toString())')
          echo "::add-mask::$RO"
          echo "DATABASE_URL=$RO" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=$RO" >> "$GITHUB_ENV"
      - name: Paid-tier settled performance, calibration, settlement audit and one day in detail
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/measure-paid-performance.ts 90 2026-11-13
      - name: Backtest, current vs proposed paid curation (chronological split)
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/backtest-paid-selection.ts 90
      - name: Calibration fit, walk-forward validation, held-out test, value strategies
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/fit-calibration.ts
      - name: Production verification, paid lifecycle audit and public leak probe
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/verify-paid-production.ts

  # Sprint 05: where fixtures leave the pipeline, per competition (Wales in
  # detail), and what the provider itself lists for Wales. The database part is
  # read-only as above. The provider probe spends at most 40 api-football calls
  # (hard cap in the script) and touches no database.
  league-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/vps-db-tunnel
        with:
          enabled: ${{ vars.DB_ON_VPS }}
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Read-only database URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          RO=$(node -e 'const u=new URL(process.env.DATABASE_URL);u.searchParams.set("options","-c default_transaction_read_only=on");console.log(u.toString())')
          echo "::add-mask::$RO"
          echo "DATABASE_URL=$RO" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=$RO" >> "$GITHUB_ENV"
      - name: Coverage funnel by competition, discovery decisions, Wales
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/measure-league-coverage.ts 45
      - name: Provider key (masked)
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          read_env() { printf '%s\n' "$PROD_ENV_FILE" | grep -E "^$1=" | head -1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"; }
          K=$(read_env API_FOOTBALL_KEY)
          if [ -z "$K" ]; then echo "::warning::API_FOOTBALL_KEY not found in PROD_ENV_FILE; provider probe skipped"; exit 0; fi
          echo "::add-mask::$K"
          echo "API_FOOTBALL_KEY=$K" >> "$GITHUB_ENV"
          H=$(read_env API_FOOTBALL_HOST)
          [ -z "$H" ] || echo "API_FOOTBALL_HOST=$H" >> "$GITHUB_ENV"
      - name: Provider probe, Welsh competitions and uncatalogued fixtures
        if: env.API_FOOTBALL_KEY != ''
        run: npx tsx scripts/research-league-coverage.ts
      - name: Candidate-quality shadow validation (chronological)
        if: hashFiles('scripts/validate-paid-candidate-quality.ts') != ''
        env:
          REQUIRE_READ_ONLY: "1"
        run: npx tsx scripts/validate-paid-candidate-quality.ts 120
