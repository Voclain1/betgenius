# Copies the Neon database onto the VPS, REPLACING what is there. Used for the
# rehearsal and, once, at cutover (docs/VPS_MIGRATION.md §5–6). Reads Neon via
# NEON_DIRECT_URL (Neon's direct, non-pooler URL), so it keeps working after
# DATABASE_URL has been repointed at the VPS.
name: vps-db-copy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REPLACE to overwrite the VPS database with a fresh copy of Neon'
        required: true

jobs:
  copy:
    if: inputs.confirm == 'REPLACE'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
      - name: Dump Neon and restore on the VPS
        env:
          NEON_DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: |
          [ -n "$NEON_DIRECT_URL" ] || { echo "::error::NEON_DIRECT_URL is not set"; exit 1; }
          docker run --rm -e NEON_DIRECT_URL postgres:17-alpine psql "$NEON_DIRECT_URL" -tAc 'SHOW server_version'
          # A failed dump stops here, before anything on the VPS is touched.
          docker run --rm -e NEON_DIRECT_URL -v "$RUNNER_TEMP:/out" postgres:17-alpine \
            sh -c 'pg_dump -Fc --no-owner --no-privileges -f /out/neon.dump "$NEON_DIRECT_URL"'
          ls -l "$RUNNER_TEMP/neon.dump"
          # pg_restore exits non-zero on harmless notices from Neon-specific
          # objects too, so its exit code is reported, not trusted: the row
          # counts in the next step decide whether the copy is good.
          ssh vps 'cd /opt/betgenius && docker compose --env-file deploy.env exec -T postgres \
              pg_restore --clean --if-exists --no-owner --no-privileges -U betgenius -d betgenius' \
            < "$RUNNER_TEMP/neon.dump" \
            || echo "::warning::pg_restore reported errors (see above); the row counts decide"
      - name: Compare row counts
        env:
          NEON_DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: |
          status=0
          for t in User Prediction Subscription PaymentAttempt GenerationAttempt; do
            neon=$(docker run --rm -e NEON_DIRECT_URL postgres:17-alpine psql "$NEON_DIRECT_URL" -tAc "SELECT count(*) FROM \"$t\"")
            vps=$(ssh vps "cd /opt/betgenius && docker compose --env-file deploy.env exec -T postgres psql -U betgenius -d betgenius -tAc 'SELECT count(*) FROM \"$t\"'")
            echo "$t: neon=$neon vps=$vps"
            [ "$neon" = "$vps" ] || status=1
          done
          exit $status
